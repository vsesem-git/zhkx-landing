# ============================================================================
#  ЖКУ · Крым — запуск одной командой:  docker compose -f deploy/docker-compose.yml up -d
#  ---------------------------------------------------------------------------
#  Данные (state.js, история ревизий, auth.json) — в томе zhkx-data.
#  Резервная копия тома:  docker run --rm -v zhkx-data:/data -v $PWD:/backup alpine \
#                            tar czf /backup/zhkx-data-$(date +%F).tar.gz -C /data .
# ============================================================================
services:
  zhkx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zhkx-crimea:2.0.0
    container_name: zhkx-crimea
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Токен доступа к API. Обязательно поменяйте на свой!
      ZHKX_TOKEN: "${ZHKX_TOKEN:-}"

      # Демо-режим: токен "demo-token", вход без пароля. Включайте ТОЛЬКО для показа.
      # ZHKX_DEMO_AUTH: "1"

      # Сколько ревизий state.js хранить в data/history/ (по умолчанию 60)
      ZHKX_HISTORY_LIMIT: "60"

      # Напоминания в Telegram (необязательно)
      # ZHKX_TELEGRAM_TOKEN: "123456:AA…"
      # ZHKX_TELEGRAM_CHAT: "123456789"
      # Час ежедневной проверки (по умолчанию 9)
      # ZHKX_NOTIFY_HOUR: "9"
    volumes:
      - zhkx-data:/app/data

volumes:
  zhkx-data:
